version: '3.8'

services:
  # GoPhish Server
  gophish:
    image: gophish/gophish:latest
    container_name: phishing-gophish
    restart: unless-stopped
    ports:
      - "3333:3333"  # Admin interface
      - "8080:80"    # Phishing server
    volumes:
      - gophish-data:/app/gophish.db
      - ./gophish/config.json:/app/config.json:ro
    environment:
      - GOPHISH_INITIAL_ADMIN_PASSWORD=${GOPHISH_ADMIN_PASSWORD:-admin}
    networks:
      - phishing-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3333/login"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Analytics Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phishing-dashboard
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./automation/config:/app/automation/config:ro
      - ./reports:/app/reports
      - ./logs:/app/logs
    environment:
      - FLASK_ENV=production
      - GOPHISH_API_URL=http://gophish:3333
      - GOPHISH_API_KEY=${GOPHISH_API_KEY}
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=5000
    depends_on:
      - gophish
    networks:
      - phishing-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: phishing-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - dashboard
      - gophish
    networks:
      - phishing-network
    profiles:
      - with-nginx

  # Optional: PostgreSQL (for production)
  postgres:
    image: postgres:15-alpine
    container_name: phishing-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-phishing}
      - POSTGRES_USER=${POSTGRES_USER:-phishing_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - phishing-network
    profiles:
      - with-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phishing_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Redis for caching
  redis:
    image: redis:7-alpine
    container_name: phishing-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - phishing-network
    profiles:
      - with-redis
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gophish-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  phishing-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
