[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-platform"
version = "1.1.0"
description = "Comprehensive Phishing Awareness Training Platform with GoPhish integration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Security Team", email = "security@company.com"}
]
keywords = ["security", "phishing", "training", "awareness", "gophish"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "flask==3.0.0",
    "flask-cors==4.0.0",
    "flask-limiter==3.5.0",
    "sqlalchemy==2.0.23",
    "requests==2.31.0",
    "urllib3==2.1.0",
    "pandas==2.1.4",
    "numpy==1.26.2",
    "matplotlib==3.8.2",
    "plotly==5.18.0",
    "seaborn==0.13.0",
    "python-dotenv==1.0.0",
    "pyyaml==6.0.1",
    "python-dateutil==2.8.2",
    "cryptography==41.0.7",
    "click==8.1.7",
    "tabulate==0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "pytest-flask==1.3.0",
    "black==23.12.1",
    "flake8==6.1.0",
    "mypy==1.8.0",
    "pylint==3.0.3",
    "types-pyyaml==6.0.12.12",
    "types-requests==2.31.0.10",
    "pre-commit==3.6.0",
]

prod = [
    "gunicorn==21.2.0",
]

[project.urls]
Homepage = "https://github.com/Raoof128/phishing-platform"
Documentation = "https://github.com/Raoof128/phishing-platform/blob/main/README.md"
Repository = "https://github.com/Raoof128/phishing-platform"
"Bug Tracker" = "https://github.com/Raoof128/phishing-platform/issues"

[project.scripts]
phishing-dashboard = "dashboard.app:main"
phishing-campaign = "automation.campaign_manager:main"
phishing-analytics = "automation.analytics:main"

# Black formatting
[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | gophish
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--verbose",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

# Coverage configuration
[tool.coverage.run]
source = ["automation", "dashboard"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/gophish/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if False:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# MyPy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_calls = false
disallow_any_generics = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "plotly.*",
    "matplotlib.*",
    "pandas.*",
    "flask_limiter.*",
]
ignore_missing_imports = true

# Pylint configuration
[tool.pylint.main]
ignore = ["gophish", "venv", ".git"]
jobs = 0
persistent = true
suggestion-mode = true

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0903",  # too-few-public-methods
    "W0212",  # protected-access
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 7
max-attributes = 10
max-bool-expr = 5
max-branches = 15
max-locals = 20
max-parents = 7
max-public-methods = 25
max-returns = 6
max-statements = 60
min-public-methods = 1
